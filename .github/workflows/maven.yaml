# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  workflow_dispatch:
  push:
    branches: [ "v6.0.6-ios-mcn" ]
    
permissions:
  contents: read
  packages: write

jobs:
  build:

    runs-on: ubuntu-latest
    
    env:
      GITHUB_USERNAME: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -s ${GITHUB_WORKSPACE}/settings.xml -B validate --file pom.xml 

    - name: Debug Environment Variable
      run:  echo "GITHUB_TOKEN:${{ secrets.GITHUB_TOKEN }}"

    - name: 🚀 Deploy to GitHub Packages
      run: |
         export GIT_TOKEN=${{ secrets.GITHUB_TOKEN }}
         mvn -s ${GITHUB_WORKSPACE}/settings.xml --batch-mode deploy -DaltDeploymentRepository=github::default::https://maven.pkg.github.com/Demo-Core-Build-Deploy/demo-netconf-test.21 -DskipTests=true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
